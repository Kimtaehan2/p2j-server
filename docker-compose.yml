# 로컬 개발용 PostgreSQL 과 Redis 만 띄운다.
# 앱 컨테이너는 아직 만들지 않는다. 서버는 호스트에서 npm run start:dev 로 실행한다.
#
#   docker compose up -d      시작
#   docker compose down       정지 (데이터는 named volume 에 남는다)
#
# docker compose down -v 는 사용하지 않는다. 팀 공용 개발 데이터가 지워진다.

services:
  postgres:
    image: postgres:16-alpine
    container_name: p2j-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: p2j
      # 한국어 정렬·비교를 위해 초기화 옵션을 고정한다.
      LANG: C.UTF-8
    ports:
      - '5432:5432'
    volumes:
      - p2j-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d p2j']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: p2j-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  p2j-postgres-data:
    name: p2j-postgres-data
