name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · type · test · migrate
    runs-on: ubuntu-latest

    # 로컬 개발용 고정값이다. 실제 비밀키는 CI 에 넣지 않는다.
    env:
      APP_ENV: test
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://postgres:devpass@localhost:5432/p2j
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-32
      SERVICE_DAY_START_HOUR: 4

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: p2j
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p2j"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --frozen

      - name: 포맷 검사
        run: uv run ruff format --check .

      - name: 린트
        run: uv run ruff check .

      - name: 타입 검사
        run: uv run mypy app

      - name: 테스트
        run: uv run pytest -q

      - name: 마이그레이션 적용 (PostgreSQL 실제 연결)
        run: uv run alembic upgrade head

      - name: 마이그레이션이 모델과 일치하는지 확인
        # 모델과 DB 가 어긋나면 autogenerate 가 변경을 제안한다. 그 경우 실패시킨다.
        run: uv run alembic check

      - name: 헬스체크 (PostgreSQL + Redis 실제 연결)
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/v1/health; then echo; exit 0; fi
            sleep 1
          done
          echo "health check failed"; curl -s http://127.0.0.1:8000/v1/health; exit 1
